services:
  translator:
    # Official upstream runtime; no OCR, translator, or inpainter is reimplemented here.
    image: zyddnys/manga-image-translator:main
    entrypoint: ["python", "server/main.py"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--start-instance"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - manga-models:/app/models
      - manga-cache:/root/.cache
    shm_size: "2gb"
    restart: unless-stopped
volumes:
  manga-models:
  manga-cache:
